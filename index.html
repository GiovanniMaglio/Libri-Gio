<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La mia Libreria - Giovanni Maglio</title>
<meta name="description" content="Uno scaffale digitale di libri letti, con recensioni personali.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,560;9..144,650&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <header class="site-header">
    <p class="eyebrow">Giovanni Maglio</p>
    <h1 class="site-title">La mia libreria</h1>
    <p class="site-sub">Alcune recensioni di libri letti.</p>
  </header>

  <div class="controls" role="search">
    <div class="field">
      <label class="visually-hidden" for="search">Cerca per titolo, autore o recensione</label>
      <input type="text" id="search" placeholder="Cerca per titolo, autore o recensione…" autocomplete="off">
    </div>
    <div class="field field-select">
      <label class="visually-hidden" for="genre-filter">Filtra per genere</label>
      <select id="genre-filter">
        <option value="">Tutti i generi</option>
      </select>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
  </div>

  <main>
    <div class="grid" id="grid" aria-live="polite"></div>
    <p class="empty-state" id="empty-state" hidden>Nessun libro corrisponde alla ricerca.</p>
  </main>

  <footer class="site-footer">
    <p>Contattami: magliogiovanni03@gmail.com</p>
  </footer>

</div>

<div class="overlay" id="overlay" hidden>
  <div class="scrim" id="scrim" tabindex="-1"></div>
  <div class="card" id="detail-card" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <button class="close-btn" id="close-btn">← torna alla libreria</button>
    <div id="detail-content"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
